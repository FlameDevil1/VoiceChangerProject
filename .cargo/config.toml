# Release builds target baseline x86-64, so they run on any 64-bit PC. Hot loops pick an AVX2
# version at runtime when the CPU has it (src/dsp/simd.rs), with bit-identical results.
#
# For a personal build tuned to one machine only, you can uncomment this (about 15 % faster DSP
# with every effect on, but the binary then crashes on CPUs without AVX2):
# [target.x86_64-pc-windows-msvc]
# rustflags = ["-C", "target-cpu=x86-64-v3"]

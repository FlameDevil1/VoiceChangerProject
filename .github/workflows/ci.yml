# Runs on every push and pull request once the repo is on GitHub.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Tests (AVX2 path where the runner supports it)
        run: cargo test --release

      - name: Tests on the baseline (non-AVX2) path
        run: cargo test --release
        env:
          VC_FORCE_BASELINE: "1"

      - name: Build release binaries
        run: cargo build --release

      - uses: actions/upload-artifact@v7
        with:
          name: voicechanger-windows-x64
          path: |
            target/release/voicechanger.exe
            target/release/vcrender.exe

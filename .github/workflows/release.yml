# Publishes a GitHub release with ready-to-run binaries when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match the version in Cargo.toml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version"; exit 1
          fi

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $dir = "VoiceChanger-$env:GITHUB_REF_NAME-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/voicechanger.exe, target/release/vcrender.exe, README.md, LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "VoiceChanger-${GITHUB_REF_NAME}-windows-x64.zip" \
            --title "Voice Changer ${GITHUB_REF_NAME}" --generate-notes

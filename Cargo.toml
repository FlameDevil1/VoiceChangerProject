[package]
name = "voice-changer"
version = "0.1.0"
edition = "2024"
description = "Real-time voice changer for Windows with virtual microphone output"
license = "MIT"

[lib]
name = "voice_changer"
path = "src/lib.rs"

[[bin]]
name = "voicechanger"
path = "src/main.rs"

[dependencies]
# `realtime` registers the audio threads with MMCSS ("Pro Audio") on Windows.
cpal = { version = "0.18.2", features = ["realtime"] }
# glow (OpenGL) is much lighter than wgpu; no persistence/serde features needed.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "accesskit", "links"] }
hound = "3.5.1"
log = "0.4.34"
# Pure-Rust port of RNNoise (BSD-3-Clause); library only.
nnnoiseless = { version = "0.5.2", default-features = false }
# Native file dialogs for preset import/export (MIT).
rfd = { version = "0.17.2", default-features = false }
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis", "adpcm"] }
# System tray icon and menu (MIT/Apache-2.0). Linux-only defaults (GTK) disabled.
tray-icon = { version = "0.26.0", default-features = false }

# Win32 APIs (single instance, hotkeys, tray). Same version cpal uses, so it compiles once.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Keep unwinding: audio callbacks use catch_unwind to fail safe instead of aborting.
panic = "unwind"

# DSP code is unusably slow unoptimised; keep debug builds responsive.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
